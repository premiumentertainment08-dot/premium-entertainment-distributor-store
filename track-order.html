<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order • Premium Entertainment</title><style>body{font-family:system-ui;background:#f8f4fb;color:#26152d;margin:0;padding:18px}.card{max-width:520px;margin:24px auto;background:white;padding:22px;border-radius:18px;box-shadow:0 8px 30px #30002015}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #ddd;margin:6px 0;font:inherit}button{background:#73003a;color:white;font-weight:800;border:0}.result{margin-top:15px;padding:14px;background:#f7edf3;border-radius:12px;line-height:1.8}.muted{color:#776b7a;font-size:13px}</style></head><body><div class="card"><h2>📦 Track Your Order</h2><p class="muted">Apna Order ID enter karein. Example: PED-20261018-ABC123</p><input id="oid" placeholder="Enter Order ID" autocomplete="off"><button id="track">Track Order</button><div id="result"></div><p class="muted"><a href="./index.html">← Back to store</a></p></div><script src="firebase-config.js"></script><script type="module">const $=id=>document.getElementById(id);const cfg=window.FIREBASE_CONFIG;let db;try{const a=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js');const f=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js');const app=a.getApps().length?a.getApp():a.initializeApp(cfg);db=f.getFirestore(app);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('track').onclick=async()=>{const id=$('oid').value.trim().toUpperCase();if(!id){$('result').textContent='Order ID enter karein.';return} $('result').textContent='Searching…';try{const s=await f.getDoc(f.doc(db,'orders',id));if(!s.exists()){$('result').textContent='Order nahi mila. ID check karke dobara try karein.';return}const o=s.data();$('result').innerHTML=`<div class="result"><b>Order ID:</b> ${esc(o.orderId)}<br><b>Product:</b> ${esc(o.product)}<br><b>Plan:</b> ${esc(o.plan)}<br><b>Amount:</b> ₹${Number(o.amount||0).toLocaleString('en-IN')}<br><b>Payment:</b> ${esc(o.paymentStatus||'Pending')}<br><b>Order Status:</b> <b>${esc(o.status||'Payment Pending')}</b><br><b>Last Update:</b> ${esc(o.updatedAt||'—')}</div>`}catch(e){$('result').textContent='Could not load order. Firebase Firestore rules must allow a customer to read an order by its exact Order ID.'}};const q=new URLSearchParams(location.search).get('id');if(q){$('oid').value=q;$('track').click()}}catch(e){$('result').textContent='Firebase setup error: '+e.message}</script></body></html>
